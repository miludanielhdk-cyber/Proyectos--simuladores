<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viajando hacia 4.º año</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una sola columna centrada tipo "boleto de tren"; vías como hilo conductor entre estaciones.
   Paleta: azul del escudo 718 + amarillo señal ferroviaria + verde/coral para correcto/reintentar. */
:root{
  --bg:#eef2fb; --surface:#ffffff; --surface-2:#e3e9f8; --ink:#16213f; --ink-soft:#4a5577;
  --blue:#1f3f9e; --blue-soft:#d7e0f7; --signal:#f2b632; --signal-soft:#fdf0cf;
  --ok:#1e8a52; --ok-soft:#d9f2e4; --retry:#c4533a; --retry-soft:#fbe3dc;
  --grid:#cdd6ec; --axis:#16213f; --line:#c4533a; --line2:#6a3fb5;
  --pt-a:#1f3f9e; --pt-ghost:rgba(31,63,158,.35);
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --base:18px; --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1528; --surface:#18213b; --surface-2:#222d4d; --ink:#eef1fb; --ink-soft:#b2bbd6;
  --blue:#8fa9f5; --blue-soft:#25346a; --signal:#f5c454; --signal-soft:#3d3214;
  --ok:#5fd394; --ok-soft:#173d2a; --retry:#f08a72; --retry-soft:#43221b;
  --grid:#2f3b60; --axis:#e6eaf7; --line:#f08a72; --line2:#c4a2f5; --pt-a:#a9bdf8; --pt-ghost:rgba(169,189,248,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1528; --surface:#18213b; --surface-2:#222d4d; --ink:#eef1fb; --ink-soft:#b2bbd6;
  --blue:#8fa9f5; --blue-soft:#25346a; --signal:#f5c454; --signal-soft:#3d3214;
  --ok:#5fd394; --ok-soft:#173d2a; --retry:#f08a72; --retry-soft:#43221b;
  --grid:#2f3b60; --axis:#e6eaf7; --line:#f08a72; --line2:#c4a2f5; --pt-a:#a9bdf8; --pt-ghost:rgba(169,189,248,.4);
  color-scheme:dark}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important} /* el botón «Siguiente» queda oculto hasta responder bien */
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
/* ---------- encabezado ---------- */
.top{display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:3px dashed var(--grid)}
.top img{width:52px;height:auto;flex:none}
.top .inst{min-width:0}
.top .inst b{font-family:var(--font-display);font-size:1.05rem;display:block}
.top .inst span{font-size:.8rem;color:var(--ink-soft)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{border:2px solid var(--grid);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.chip:hover{border-color:var(--blue)}
/* ---------- tarjetas y botones ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:22px;margin-top:18px;box-shadow:0 2px 0 var(--grid)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-family:var(--font-display);font-weight:600;font-size:1.02rem;
  background:var(--blue);color:var(--surface);display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btn.sig{background:var(--signal);color:#16213f}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
/* ---------- portada ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:2.3rem;color:var(--blue)}
.hero .badge{display:inline-block;background:var(--signal);color:#16213f;font-family:var(--font-display);font-weight:600;
  border-radius:8px;padding:2px 10px;font-size:.9rem;margin-bottom:8px}
.hero img{width:120px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.rule{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.rule b{font-family:var(--font-display);font-size:1.05rem}
.ex{background:var(--signal-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--grid);border-radius:10px;padding:8px 10px}
table.vt input{width:5.2rem;text-align:center;font-weight:700}
/* ---------- mapa ---------- */
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;position:relative}
.stop{background:var(--surface);border:3px solid var(--grid);border-radius:14px;padding:12px 10px;text-align:left;color:var(--ink);
  display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative}
.stop:hover{border-color:var(--blue)}
.stop .n{font-family:var(--font-display);font-weight:700;font-size:1.5rem;color:var(--blue);line-height:1}
.stop .t{font-size:.85rem;line-height:1.25}
.stop .st{margin-top:auto;font-size:.78rem;font-weight:700}
.stop.done{border-color:var(--ok);background:var(--ok-soft)}
.stop.done .st{color:var(--ok)}
.stop.prog .st{color:var(--blue)}
.meter{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 18px,var(--signal) 18px 22px);transition:width .5s}
/* ---------- estación ---------- */
.sthead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.sthead h2{font-size:1.45rem}
.sthead .lbl{font-family:var(--font-display);color:var(--blue);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surface-2);color:var(--ink-soft)}
.dots span.on{background:var(--signal);color:#16213f}
.dots span.ok{background:var(--ok);color:var(--surface)}
.ctx{background:var(--signal-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.q .say{flex:none;border:none;background:var(--surface-2);border-radius:50%;width:38px;height:38px}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
.stage.single{grid-template-columns:minmax(0,1fr)}
.planebox{min-width:0}
.planebox svg{width:100%;height:auto;max-width:560px;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--grid);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-size:1.05rem;font-weight:700}
.opt:hover{border-color:var(--blue)}
.opt.bad{border-color:var(--retry);background:var(--retry-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tg{padding:6px 12px;border-radius:10px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.tg.now{background:var(--signal);color:#16213f}
.tg.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.tblwrap{overflow-x:auto}
table.vt{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0}
table.vt th,table.vt td{border:2px solid var(--grid);padding:6px 8px;text-align:center;min-width:64px}
table.vt th{background:var(--blue-soft);font-family:var(--font-display);font-weight:600;text-align:left;white-space:nowrap}
table.vt input.good{border-color:var(--ok);background:var(--ok-soft)}
table.vt input.bad{border-color:var(--retry);background:var(--retry-soft)}
.hoja{display:flex;gap:10px;align-items:flex-start;background:var(--signal-soft);border:2px dashed var(--signal);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:1.05rem;font-variant-numeric:tabular-nums}
.hoja .op{white-space:nowrap;font-weight:700}
.planebox svg{max-height:min(620px,78vh)}
.hoja .pen{font-size:1.4rem;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:8px;font-weight:700}
.legend i{display:inline-block;width:30px;border-top:4px solid;vertical-align:middle;margin-right:6px}
.legend i.dash{border-top-style:dashed}
.formula{display:inline-block;background:var(--blue-soft);border-radius:10px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;display:none;gap:12px;align-items:center}
.fb.show{display:flex}
.fb .face{font-size:2.2rem;line-height:1}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--retry-soft)}
.fb.info{background:var(--signal-soft)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.help{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:12px 14px;display:none}
.help.show{display:block}
/* ---------- fracciones, cajita y ecuaciones ---------- */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .12em;font-variant-numeric:tabular-nums;font-weight:700}
.fr>span{padding:0 .18em;display:block;text-align:center}
.fr>span:first-child{border-bottom:3px solid currentColor;padding-bottom:2px}
.fr>span:last-child{padding-top:2px}
.box{display:inline-grid;place-items:center;min-width:1.5em;height:1.35em;padding:0 .15em;border:3px solid var(--blue);border-radius:8px;background:var(--blue-soft);color:var(--blue);font-weight:700;vertical-align:middle;line-height:1}
.fr .box{height:1.25em;margin:2px 0}
.eqn{font-size:1.9rem;font-weight:700;text-align:center;background:var(--surface-2);border-radius:14px;padding:16px 10px;margin:2px 0 14px;font-variant-numeric:tabular-nums;line-height:1.4;overflow-x:auto;white-space:nowrap}
.picbox{display:flex;justify-content:center;margin:2px 0 14px}
.picbox svg{width:100%;max-width:460px;height:auto}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.grid2 .opt{text-align:center;font-size:1.4rem;padding:14px 10px}
.rules.r4{grid-template-columns:repeat(2,minmax(0,1fr))}
/* ---------- modales ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,35,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:640px;width:100%;margin-top:4vh}
.steps li{margin-bottom:6px}
.steps li.cur{font-weight:700;color:var(--blue)}
/* ---------- diploma ---------- */
.diploma{background:#fffdf6;color:#16213f;border:10px double #1f3f9e;border-radius:6px;padding:28px;text-align:center;position:relative}
.diploma img{width:96px}
.diploma h2{font-size:2.2rem;color:#1f3f9e;margin-top:6px}
.diploma .who{font-family:var(--font-display);font-size:2rem;border-bottom:2px solid #c9a227;display:inline-block;padding:0 20px;margin:8px 0}
.diploma .seal{font-size:3rem}
.diploma .firma{display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;margin-top:26px;font-size:.85rem}
.diploma .firma div{border-top:1.5px solid #16213f;padding-top:4px;min-width:180px}
/* ---------- actividades ---------- */
.act{border-top:2px dashed var(--grid);padding-top:14px;margin-top:14px}
.act h3{font-size:1.1rem;color:var(--blue)}
.act ol{padding-left:1.3rem}
.key{display:none;background:var(--ok-soft);border-radius:10px;padding:10px 14px;margin-top:8px}
.key.show{display:block}
.blank{display:inline-block;min-width:3.5rem;border-bottom:2px solid var(--ink-soft)}
.panel table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.panel th,.panel td{border:1px solid var(--grid);padding:5px 6px;text-align:center}
.panel th{background:var(--blue-soft)}
.foot{margin-top:30px;text-align:center;font-size:.8rem;color:var(--ink-soft)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
svg .pop{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
svg .fade{animation:fade .5s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
body.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .eqn{font-size:1.5rem}
  .stage{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero img{display:none}
  .hero h1{font-size:1.9rem}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  .noprint,.top,.tools,.foot{display:none!important}
  .card{box-shadow:none;margin:0;padding:8px}
  .printhide{display:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img class="logo718" alt="Escudo de la Escuela N.º 718 Libertad">
    <div class="inst"><b>Escuela N.º 718 "Libertad"</b><span>Rada Tilly · Chubut · Matemática · Prof. y Mg. Hugo D. Karlau</span></div>
  </header>
  <div class="tools noprint" role="toolbar" aria-label="Opciones">
    <button class="chip" id="fMinus" aria-label="Letra más chica">A−</button>
    <button class="chip" id="fPlus" aria-label="Letra más grande">A+</button>
    <button class="chip" id="tMusic" aria-pressed="false">🎵 Música</button>
    <button class="chip" id="tVoice" aria-pressed="true">🔊 Voz y sonidos</button>
    <button class="chip" id="tCalm" aria-pressed="false">🌙 Modo tranquilo</button>
    <button class="chip" id="goMap">🗺️ Mapa del viaje</button>
    <button class="chip" id="goAct">📝 Actividades</button>
  </div>
  <main id="app"></main>
  <p class="foot">Material educativo accesible · Repaso integrador de 3.º año · Prof. y Mg. Hugo D. Karlau · <span style="white-space:nowrap">Panel docente: Ctrl + D</span></p>
</div>

const MINUS = "\u2212";
const fmt = n => (n < 0 ? MINUS + Math.abs(n) : String(n));
const co = (x, y) => `(${fmt(x)}\u00a0;\u00a0${fmt(y)})`; // espacios que no se cortan
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mul = "×";
function rule(a, b, X = "x", Y = "y") { // texto de fórmula lineal (si a < 0, se escribe como resta: y = b − a × x)
  if (a < 0) return `${Y} = ${b} ${MINUS} ${a === -1 ? "" : -a + " " + mul + " "}${X}`;
  let s = `${Y} = ${a === 1 ? "" : a + " " + mul + " "}${X}`;
  if (b > 0) s += ` + ${b}`; else if (b < 0) s += ` ${MINUS} ${-b}`;
  return s;
}
/* opciones: la primera es la correcta; se mezclan y se eliminan repetidas */
function mkOpts(correct, ...wrong) {
  const seen = new Set([correct]); const out = [{ t: correct, ok: true }];
  wrong.forEach(w => { if (!seen.has(w)) { seen.add(w); out.push({ t: w, ok: false }); } });
  return shuffle(out);
}
function moveText(n, axis) {
  if (axis === "x") return n === 0 ? "no te movés hacia los costados" : n > 0 ? `vas ${n} hacia la derecha` : `vas ${-n} hacia la izquierda`;
  return n === 0 ? "no vas hacia arriba ni hacia abajo" : n > 0 ? `vas ${n} hacia arriba` : `vas ${-n} hacia abajo`;
}
function walkSolve(x, y) {
  return [
    "Empezá en el origen: el punto (0 ; 0), donde se cruzan los dos ejes.",
    `El 1.º número es ${fmt(x)}: ${moveText(x, "x")}.`,
    `El 2.º número es ${fmt(y)}: desde ahí ${moveText(y, "y")}.`,
    `¡Llegaste! Ese es el punto ${co(x, y)}.`
  ];
}
const HELP_PLACE = "Empezá siempre en el (0 ; 0). El 1.º número te dice cuánto vas hacia la derecha (si es positivo) o hacia la izquierda (si es negativo). El 2.º número te dice cuánto vas hacia arriba (positivo) o hacia abajo (negativo).";

const P5 = { xmin: -5, xmax: 5, ymin: -5, ymax: 5 };
const P6 = { xmin: -6, xmax: 6, ymin: -6, ymax: 6 };
const lc = t => t.charAt(0).toLowerCase() + t.slice(1); // "Vela A" → "vela A"
const nz = (a, b) => { let v; do { v = rnd(a, b); } while (v === 0); return v; }; // entero distinto de 0

const cuenta = (a, op, b) => `${a} ${op} ${b}`;
const HOJA = (txt, nota) => `<span class="op">${txt} = ?</span>${nota ? ` <span class="small muted">(${nota})</span>` : ""}`;

function readOptions(x, y) { // distractores de lectura de coordenadas
  const c = co(x, y);
  const pool = [co(-x, y), co(x, -y), co(-x, -y), co(-y, x), co(y, -x)];
  const chosen = [];
  if (co(y, x) !== c) chosen.push(co(y, x)); // orden invertido: el error más frecuente
  shuffle(pool).forEach(w => { if (chosen.length < 3 && w !== c && !chosen.includes(w)) chosen.push(w); });
  return mkOpts(c, ...chosen);
}

}

  const cx = square ? Math.min(46, 440 / Math.max(nx, ny)) : Math.min(46, 440 / nx), cy = square ? cx : Math.min(46, 440 / ny), cell = Math.min(cx, cy);
  const ml = cfg.yLabel ? 64 : 34, mr = 24, mt = cfg.yLabel ? 34 : 20, mb = cfg.xLabel ? 54 : 34;

  s += `<rect x="${px(cfg.xmin)}" y="${py(cfg.ymax)}" width="${g.nx * g.cx}" height="${g.ny * g.cy}" fill="var(--surface)"/>`;
  for (let i = 0; i <= g.nx; i++) { const x = px(cfg.xmin + i * g.xs); s += `<line x1="${x}" y1="${py(cfg.ymax)}" x2="${x}" y2="${py(cfg.ymin)}" stroke="var(--grid)" stroke-width="1.2"/>`; }
  for (let j = 0; j <= g.ny; j++) { const y = py(cfg.ymin + j * g.ys); s += `<line x1="${px(cfg.xmin)}" y1="${y}" x2="${px(cfg.xmax)}" y2="${y}" stroke="var(--grid)" stroke-width="1.2"/>`; }
  const ax = Math.max(cfg.xmin, Math.min(0, cfg.xmax)), ay = Math.max(cfg.ymin, Math.min(0, cfg.ymax));
  s += `<line x1="${px(cfg.xmin) - (cfg.xmin < 0 ? 10 : 0)}" y1="${py(ay)}" x2="${px(cfg.xmax) + 14}" y2="${py(ay)}" stroke="var(--axis)" stroke-width="2.4" marker-end="url(#arr)" ${cfg.xmin < 0 ? 'marker-start="url(#arr)"' : ""}/>`;
  s += `<line x1="${px(ax)}" y1="${py(cfg.ymin) + (cfg.ymin < 0 ? 10 : 0)}" x2="${px(ax)}" y2="${py(cfg.ymax) - 14}" stroke="var(--axis)" stroke-width="2.4" marker-end="url(#arr)" ${cfg.ymin < 0 ? 'marker-start="url(#arr)"' : ""}/>`;
  const fs = Math.max(12, Math.min(15, g.cell * .36));
  for (let i = 0; i <= g.nx; i++) { const v = cfg.xmin + i * g.xs; if (v === 0 && cfg.ymin < 0) continue;
    s += `<text x="${px(v)}" y="${py(ay) + fs + 5}" text-anchor="middle" font-size="${fs}" fill="var(--ink)" font-weight="700" font-family="Atkinson Hyperlegible,Verdana,sans-serif">${fmt(v)}</text>`; }
  for (let j = 0; j <= g.ny; j++) { const v = cfg.ymin + j * g.ys; if (v === 0) continue;
    s += `<text x="${px(ax) - 6}" y="${py(v) + fs * .35}" text-anchor="end" font-size="${fs}" fill="var(--ink)" font-weight="700" font-family="Atkinson Hyperlegible,Verdana,sans-serif">${fmt(v)}</text>`; }
  if (cfg.ymin < 0 || cfg.xmin < 0) s += `<text x="${px(0) - 6}" y="${py(0) + fs + 4}" text-anchor="end" font-size="${fs}" fill="var(--ink)" font-weight="700">0</text>`;
  if (cfg.xLabel) s += `<text x="${(px(cfg.xmin) + px(cfg.xmax)) / 2}" y="${g.H - 10}" text-anchor="middle" font-size="15" fill="var(--blue)" font-weight="700" font-family="Fredoka,sans-serif">${cfg.xLabel} →</text>`;
  if (cfg.yLabel) s += `<text x="${px(cfg.xmin)}" y="${py(cfg.ymax) - 18}" text-anchor="start" font-size="15" fill="var(--blue)" font-weight="700" font-family="Fredoka,sans-serif">↑ ${cfg.yLabel}</text>`;
  if (cfg.xmin < 0 && cfg.ymin < 0 && opts.quadrants) {
    [["1.º", 1, 1], ["2.º", -1, 1], ["3.º", -1, -1], ["4.º", 1, -1]].forEach(([t, sx, sy]) => {
      s += `<text x="${px(sx * (cfg.xmax - .6))}" y="${py(sy * (cfg.ymax - .6)) + 5}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">${t}</text>`; });
  }
  // recta
  const ln = opts.line || cfg.line;
  if (ln) {
    s += `<g clip-path="url(#clipP)"><line x1="${px(cfg.xmin)}" y1="${py(ln.a * cfg.xmin + ln.b)}" x2="${px(cfg.xmax)}" y2="${py(ln.a * cfg.xmax + ln.b)}" stroke="var(--line)" stroke-width="4" stroke-linecap="round" class="fade"/></g>`;
    if (cfg.dotsOnLine) for (let x = Math.ceil(cfg.xmin); x <= cfg.xmax; x++) { const y = ln.a * x + ln.b; if (y >= cfg.ymin && y <= cfg.ymax) s += `<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="var(--line)"/>`; }
  }
  // dos o más rectas (estación 9): la segunda va punteada para distinguirla sin depender del color
  (cfg.lines || []).forEach((L, k) => {
    s += `<g clip-path="url(#clipP)"><line x1="${px(cfg.xmin)}" y1="${py(L.a * cfg.xmin + L.b)}" x2="${px(cfg.xmax)}" y2="${py(L.a * cfg.xmax + L.b)}" stroke="${L.color}" stroke-width="4" stroke-linecap="round" ${k ? 'stroke-dasharray="10 7"' : ""} class="fade"/></g>`;
    for (let x = Math.ceil(cfg.xmin); x <= cfg.xmax; x++) { const y = L.a * x + L.b; if (y >= cfg.ymin && y <= cfg.ymax) s += `<circle cx="${px(x)}" cy="${py(y)}" r="5" fill="${L.color}"/>`; }
  });
  // camino animado (para "cómo se resuelve"): sale de (sx0 ; sy0), que por defecto es el origen
  if (opts.walk) {
    const [wx, wy, stage, sx0 = 0, sy0 = 0] = opts.walk;
    if (stage >= 1) s += `<circle cx="${px(sx0)}" cy="${py(sy0)}" r="8" fill="var(--signal)" stroke="var(--axis)" stroke-width="2"/>`;
    if (stage >= 2 && wx !== sx0) s += `<line x1="${px(sx0)}" y1="${py(sy0)}" x2="${px(wx)}" y2="${py(sy0)}" stroke="var(--signal)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrW)"/>`;
    if (stage >= 3 && wy !== sy0) s += `<line x1="${px(wx)}" y1="${py(sy0)}" x2="${px(wx)}" y2="${py(wy)}" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrW)"/>`;
    if (stage >= 4) s += `<circle cx="${px(wx)}" cy="${py(wy)}" r="10" fill="var(--ok)" stroke="var(--surface)" stroke-width="3"/>`;
  }
  // segmentos entre puntos colocados
  const pts = opts.points || [];
  if (opts.connect && pts.length > 1) {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${px(p.x)},${py(p.y)}`).join(" ") + (opts.closed ? " Z" : "");
    s += `<path d="${d}" fill="${opts.closed ? "var(--blue-soft)" : "none"}" fill-opacity=".7" stroke="var(--blue)" stroke-width="3.5" stroke-linejoin="round"/>`;
  }
  pts.forEach(p => {
    s += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="8" fill="${p.color || "var(--pt-a)"}" stroke="var(--surface)" stroke-width="2.5" class="pop"/>`;
    if (p.label !== undefined && p.label !== "") s += `<text x="${px(p.x) + 10}" y="${py(p.y) - 10}" font-size="18" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke" font-family="Fredoka,sans-serif">${p.label}</text>`;
  });
  if (opts.interactive) s += `<circle id="ghost" r="9" fill="var(--pt-ghost)" cx="-50" cy="-50"/><rect id="hit" x="${px(cfg.xmin) - g.cx / 2}" y="${py(cfg.ymax) - g.cy / 2}" width="${(g.nx + 1) * g.cx}" height="${(g.ny + 1) * g.cy}" fill="transparent" style="cursor:crosshair"/>`;
  return s + "</svg>";
}
function svgPointToData(svg, cfg, evt) {
  const g = planeGeom(cfg); const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const m = svg.getScreenCTM(); if (!m) return null; const p = pt.matrixTransform(m.inverse());
  const x = Math.round((p.x - g.ml) / g.cx) * g.xs + cfg.xmin, y = cfg.ymax - Math.round((p.y - g.mt) / g.cy) * g.ys;
  if (x < cfg.xmin || x > cfg.xmax || y < cfg.ymin || y > cfg.ymax) return null;
  return { x, y, sx: g.px(x), sy: g.py(y) };
}

function stripHTML(h) { // texto para la voz: las fracciones se leen («tres cuartos») y la cajita se nombra

function tableHTML(h, cols, edit) {

function checkTable(step) {
  if (cur.stepDone) return;
  const inps = [...app.querySelectorAll("table.vt input")]; let bad = 0, empty = 0;
  inps.forEach(inp => { const v = inp.value.replace(",", ".").replace(/[−–—]/g, "-").replace(/\s/g, "");

function bindPlane(cfg, step) {

    } else {
      let msg, type;
      if (step.hide) {
        const [sx, sy] = step.from, [dx, dy] = step.move;
        const lado = (p.x === sx - dx && p.y === t.y) || (p.y === sy - dy && p.x === t.x) || (p.x === sx - dx && p.y === sy - dy);
        msg = lado ? `Marcaste ${co(p.x, p.y)}. Revisá hacia qué lado vas. Volvé a A y fijate: ${moveText(dx, "x")} y después ${moveText(dy, "y")}.`

        stepBad(msg, lado ? "signo" : "conteo"); return;
      }
      if (p.x === t.y && p.y === t.x) { msg = `Marcaste ${co(p.x, p.y)}. ¡Ojo con el orden! Primero va el movimiento hacia los costados (→ ←) y después hacia arriba o abajo (↑ ↓).`; type = "orden"; }
      else if ((p.x === -t.x && t.x !== 0 && p.y === t.y) || (p.y === -t.y && t.y !== 0 && p.x === t.x) || (p.x === -t.x && p.y === -t.y)) { msg = `Marcaste ${co(p.x, p.y)}. Revisá el signo: el negativo te lleva hacia la izquierda o hacia abajo.`; type = "signo"; }

      else { msg = `Marcaste ${co(p.x, p.y)}. Buscamos ${co(t.x, t.y)}. Empezá desde el (0 ; 0).`; type = "conteo"; }

/* ---------- 5) SONIDO, VOZ Y MÚSICA ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type = "sine", vol = .12) { const c = ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, c.currentTime + t0); g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .02); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + d); o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + d + .05); }
function beep(k) {
  if (!S.voice) return;
  if (k === "ok") { tone(660, 0, .15); tone(880, .12, .25); }
  else if (k === "bad") { tone(300, 0, .2, "triangle", .08); }
  else if (k === "tick") { tone(740, 0, .1, "sine", .08); }
  else if (k === "start") { tone(523, 0, .15); tone(659, .14, .15); tone(784, .28, .3); }
  else if (k === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .14, .35, "triangle", .1)); }
}
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /es[-_]AR/i.test(v.lang)) || vs.find(v => /es[-_](419|MX|US)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; } catch (e) {} }
function say(text, force) {
  if (!S.voice || !text) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/−/g, "menos ").replace(/×/g, " por ")); u.lang = VOICE ? VOICE.lang : "es-AR"; if (VOICE) u.voice = VOICE; u.rate = .95; speechSynthesis.speak(u); } catch (e) {}
}
let music = null;
function startMusic() { // música suave y alegre generada en el momento (sin archivos externos)
  const c = ac(); if (!c) return;
  const notes = [392, 494, 587, 494, 440, 523, 659, 523, 392, 494, 587, 784, 659, 587, 523, 494];
  const bass = [196, 196, 220, 220, 196, 196, 165, 175];
  let i = 0;
  music = setInterval(() => { tone(notes[i % notes.length], 0, .28, "triangle", .035); if (i % 2 === 0) tone(bass[(i / 2) % bass.length], 0, .5, "sine", .04); i++; }, 300);
}
function stopMusic() { if (music) clearInterval(music); music = null; }

function confetti() {
  if (S.calm || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const cx = cv.getContext("2d"); const cols = ["#1f3f9e", "#f2b632", "#1e8a52", "#c4533a", "#8fa9f5"];
  const P = Array.from({ length: 120 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, r: 4 + Math.random() * 5, c: pick(cols), a: Math.random() * 6 }));
  let f = 0; (function loop() { cx.clearRect(0, 0, cv.width, cv.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); cx.restore(); }); if (++f < 140) requestAnimationFrame(loop); else cv.remove(); })();
}

  document.getElementById("fPlus").onclick = () => { S.font = Math.min(24, S.font + 1); applyPrefs(); save(); };
  document.getElementById("tVoice").onclick = () => { S.voice = !S.voice; applyPrefs(); save(); if (S.voice) say("Voz activada"); else try { speechSynthesis.cancel(); } catch (e) {} };
  document.getElementById("tCalm").onclick = () => { S.calm = !S.calm; if (S.calm) { stopMusic(); document.getElementById("tMusic").setAttribute("aria-pressed", false); } applyPrefs(); save(); };
  document.getElementById("tMusic").onclick = ev => { const on = !music; if (on) startMusic(); else stopMusic(); ev.currentTarget.setAttribute("aria-pressed", on); };
  document.getElementById("goMap").onclick = () => { if (!S.name) return screenHome(); screenMap(); };
  document.getElementById("goAct").onclick = screenActs;
  document.addEventListener("keydown", ev => { if (ev.ctrlKey && (ev.key === "d" || ev.key === "D")) { ev.preventDefault(); openPanel(); } });
  screenHome();
}
if (typeof window !== "undefined" && typeof document !== "undefined" && document.getElementById) init();
</script>
