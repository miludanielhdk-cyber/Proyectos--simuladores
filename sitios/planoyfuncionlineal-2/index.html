<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viaje por el Plano 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una sola columna centrada tipo "boleto de tren"; vías como hilo conductor entre estaciones.
   Paleta: azul del escudo 718 + amarillo señal ferroviaria + verde/coral para correcto/reintentar. */
:root{
  --bg:#eef2fb; --surface:#ffffff; --surface-2:#e3e9f8; --ink:#16213f; --ink-soft:#4a5577;
  --blue:#1f3f9e; --blue-soft:#d7e0f7; --signal:#f2b632; --signal-soft:#fdf0cf;
  --ok:#1e8a52; --ok-soft:#d9f2e4; --retry:#c4533a; --retry-soft:#fbe3dc;
  --grid:#cdd6ec; --axis:#16213f; --line:#c4533a;
  --pt-a:#1f3f9e; --pt-ghost:rgba(31,63,158,.35);
  --font-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --base:18px; --radius:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1528; --surface:#18213b; --surface-2:#222d4d; --ink:#eef1fb; --ink-soft:#b2bbd6;
  --blue:#8fa9f5; --blue-soft:#25346a; --signal:#f5c454; --signal-soft:#3d3214;
  --ok:#5fd394; --ok-soft:#173d2a; --retry:#f08a72; --retry-soft:#43221b;
  --grid:#2f3b60; --axis:#e6eaf7; --line:#f08a72; --pt-a:#a9bdf8; --pt-ghost:rgba(169,189,248,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1528; --surface:#18213b; --surface-2:#222d4d; --ink:#eef1fb; --ink-soft:#b2bbd6;
  --blue:#8fa9f5; --blue-soft:#25346a; --signal:#f5c454; --signal-soft:#3d3214;
  --ok:#5fd394; --ok-soft:#173d2a; --retry:#f08a72; --retry-soft:#43221b;
  --grid:#2f3b60; --axis:#e6eaf7; --line:#f08a72; --pt-a:#a9bdf8; --pt-ghost:rgba(169,189,248,.4);
  color-scheme:dark}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.15;margin:0}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important} /* el botón «Siguiente» queda oculto hasta responder bien */
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto}
/* ---------- encabezado ---------- */
.top{display:flex;align-items:center;gap:14px;padding-block:14px;border-bottom:3px dashed var(--grid)}
.top img{width:52px;height:auto;flex:none}
.top .inst{min-width:0}
.top .inst b{font-family:var(--font-display);font-size:1.05rem;display:block}
.top .inst span{font-size:.8rem;color:var(--ink-soft)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{border:2px solid var(--grid);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.chip:hover{border-color:var(--blue)}
/* ---------- tarjetas y botones ---------- */
.card{background:var(--surface);border-radius:var(--radius);padding:22px;margin-top:18px;box-shadow:0 2px 0 var(--grid)}
.btn{border:none;border-radius:14px;padding:12px 20px;font-family:var(--font-display);font-weight:600;font-size:1.02rem;
  background:var(--blue);color:var(--surface);display:inline-flex;align-items:center;gap:8px}
.btn.alt{background:var(--surface-2);color:var(--ink)}
.btn.sig{background:var(--signal);color:#16213f}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--ink-soft)}
.small{font-size:.85rem}
/* ---------- portada ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.hero h1{font-size:2.3rem;color:var(--blue)}
.hero .badge{display:inline-block;background:var(--signal);color:#16213f;font-family:var(--font-display);font-weight:600;
  border-radius:8px;padding:2px 10px;font-size:.9rem;margin-bottom:8px}
.hero img{width:120px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.rule{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.rule b{font-family:var(--font-display);font-size:1.05rem}
.ex{background:var(--signal-soft);border-radius:12px;padding:12px 14px;margin-top:12px}
input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--grid);border-radius:10px;padding:8px 10px}
table.vt input{width:5.2rem;text-align:center;font-weight:700}
/* ---------- mapa ---------- */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px;position:relative}
.stop{background:var(--surface);border:3px solid var(--grid);border-radius:14px;padding:12px 10px;text-align:left;color:var(--ink);
  display:flex;flex-direction:column;gap:4px;min-height:118px;position:relative}
.stop:hover{border-color:var(--blue)}
.stop .n{font-family:var(--font-display);font-weight:700;font-size:1.5rem;color:var(--blue);line-height:1}
.stop .t{font-size:.85rem;line-height:1.25}
.stop .st{margin-top:auto;font-size:.78rem;font-weight:700}
.stop.done{border-color:var(--ok);background:var(--ok-soft)}
.stop.done .st{color:var(--ok)}
.stop.prog .st{color:var(--blue)}
.meter{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 18px,var(--signal) 18px 22px);transition:width .5s}
/* ---------- estación ---------- */
.sthead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.sthead h2{font-size:1.45rem}
.sthead .lbl{font-family:var(--font-display);color:var(--blue);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--surface-2);color:var(--ink-soft)}
.dots span.on{background:var(--signal);color:#16213f}
.dots span.ok{background:var(--ok);color:var(--surface)}
.ctx{background:var(--signal-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.q{font-size:1.12rem;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.q .say{flex:none;border:none;background:var(--surface-2);border-radius:50%;width:38px;height:38px}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
.stage.single{grid-template-columns:minmax(0,1fr)}
.planebox{min-width:0}
.planebox svg{width:100%;height:auto;max-width:560px;display:block;margin:0 auto;touch-action:manipulation;user-select:none}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--grid);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;text-align:left;font-size:1.05rem;font-weight:700}
.opt:hover{border-color:var(--blue)}
.opt.bad{border-color:var(--retry);background:var(--retry-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tg{padding:6px 12px;border-radius:10px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.tg.now{background:var(--signal);color:#16213f}
.tg.done{background:var(--ok-soft);color:var(--ok);text-decoration:line-through}
.tblwrap{overflow-x:auto}
table.vt{border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0}
table.vt th,table.vt td{border:2px solid var(--grid);padding:6px 8px;text-align:center;min-width:64px}
table.vt th{background:var(--blue-soft);font-family:var(--font-display);font-weight:600;text-align:left;white-space:nowrap}
table.vt input.good{border-color:var(--ok);background:var(--ok-soft)}
table.vt input.bad{border-color:var(--retry);background:var(--retry-soft)}
.formula{display:inline-block;background:var(--blue-soft);border-radius:10px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;display:none;gap:12px;align-items:center}
.fb.show{display:flex}
.fb .face{font-size:2.2rem;line-height:1}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--retry-soft)}
.fb.info{background:var(--signal-soft)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.help{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:12px 14px;display:none}
.help.show{display:block}
/* ---------- modales ---------- */
.modal{position:fixed;inset:0;background:rgba(10,16,35,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal .card{max-width:640px;width:100%;margin-top:4vh}
.steps li{margin-bottom:6px}
.steps li.cur{font-weight:700;color:var(--blue)}
/* ---------- diploma ---------- */
.diploma{background:#fffdf6;color:#16213f;border:10px double #1f3f9e;border-radius:6px;padding:28px;text-align:center;position:relative}
.diploma img{width:96px}
.diploma h2{font-size:2.2rem;color:#1f3f9e;margin-top:6px}
.diploma .who{font-family:var(--font-display);font-size:2rem;border-bottom:2px solid #c9a227;display:inline-block;padding:0 20px;margin:8px 0}
.diploma .seal{font-size:3rem}
.diploma .firma{display:flex;justify-content:space-around;flex-wrap:wrap;gap:20px;margin-top:26px;font-size:.85rem}
.diploma .firma div{border-top:1.5px solid #16213f;padding-top:4px;min-width:180px}
/* ---------- actividades ---------- */
.act{border-top:2px dashed var(--grid);padding-top:14px;margin-top:14px}
.act h3{font-size:1.1rem;color:var(--blue)}
.act ol{padding-left:1.3rem}
.key{display:none;background:var(--ok-soft);border-radius:10px;padding:10px 14px;margin-top:8px}
.key.show{display:block}
.blank{display:inline-block;min-width:3.5rem;border-bottom:2px solid var(--ink-soft)}
.panel table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.panel th,.panel td{border:1px solid var(--grid);padding:5px 6px;text-align:center}
.panel th{background:var(--blue-soft)}
.foot{margin-top:30px;text-align:center;font-size:.8rem;color:var(--ink-soft)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
svg .pop{transform-box:fill-box;transform-origin:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
svg .fade{animation:fade .5s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
body.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:720px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rules{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero img{display:none}
  .hero h1{font-size:1.9rem}
}
@media print{
  body{background:#fff;color:#000;padding:0}
  .noprint,.top,.tools,.foot{display:none!important}
  .card{box-shadow:none;margin:0;padding:8px}
  .printhide{display:none!important}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img class="logo718" alt="Escudo de la Escuela N.º 718 Libertad">
    <div class="inst"><b>Escuela N.º 718 "Libertad"</b><span>Rada Tilly · Chubut · Matemática · Prof. y Mg. Hugo D. Karlau</span></div>
  </header>
  <div class="tools noprint" role="toolbar" aria-label="Opciones">
    <button class="chip" id="fMinus" aria-label="Letra más chica">A−</button>
    <button class="chip" id="fPlus" aria-label="Letra más grande">A+</button>
    <button class="chip" id="tMusic" aria-pressed="false">🎵 Música</button>
    <button class="chip" id="tVoice" aria-pressed="true">🔊 Voz y sonidos</button>
    <button class="chip" id="tCalm" aria-pressed="false">🌙 Modo tranquilo</button>
    <button class="chip" id="goMap">🗺️ Mapa del viaje</button>
    <button class="chip" id="goAct">📝 Actividades</button>
  </div>
  <main id="app"></main>
  <p class="foot">Material educativo accesible · Plano cartesiano, tablas y gráficos (nivel 2) · Prof. y Mg. Hugo D. Karlau · <span style="white-space:nowrap">Panel docente: Ctrl + D</span></p>
</div>

const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function mkOpts(correct, ...wrong) {

    if (stage >= 2 && wx !== 0) s += `<line x1="${px(0)}" y1="${py(0)}" x2="${px(wx)}" y2="${py(0)}" stroke="var(--signal)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrW)"/>`;
    if (stage >= 3 && wy !== 0) s += `<line x1="${px(wx)}" y1="${py(0)}" x2="${px(wx)}" y2="${py(wy)}" stroke="var(--ok)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrW)"/>`;
    if (stage >= 4) s += `<circle cx="${px(wx)}" cy="${py(wy)}" r="10" fill="var(--ok)" stroke="var(--surface)" stroke-width="3"/>`;
  }
  // segmentos entre puntos colocados
  const pts = opts.points || [];
  if (opts.connect && pts.length > 1) {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${px(p.x)},${py(p.y)}`).join(" ") + (opts.closed ? " Z" : "");
    s += `<path d="${d}" fill="${opts.closed ? "var(--blue-soft)" : "none"}" fill-opacity=".7" stroke="var(--blue)" stroke-width="3.5" stroke-linejoin="round"/>`;
  }
  pts.forEach(p => {
    s += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="8" fill="${p.color || "var(--pt-a)"}" stroke="var(--surface)" stroke-width="2.5" class="pop"/>`;
    if (p.label !== undefined && p.label !== "") s += `<text x="${px(p.x) + 10}" y="${py(p.y) - 10}" font-size="18" font-weight="700" fill="var(--ink)" stroke="var(--surface)" stroke-width="4" paint-order="stroke" font-family="Fredoka,sans-serif">${p.label}</text>`;
  });
  if (opts.interactive) s += `<circle id="ghost" r="9" fill="var(--pt-ghost)" cx="-50" cy="-50"/><rect id="hit" x="${px(cfg.xmin) - g.cell / 2}" y="${py(cfg.ymax) - g.cell / 2}" width="${(g.nx + 1) * g.cell}" height="${(g.ny + 1) * g.cell}" fill="transparent" style="cursor:crosshair"/>`;
  return s + "</svg>";
}
function svgPointToData(svg, cfg, evt) {
  const g = planeGeom(cfg); const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const m = svg.getScreenCTM(); if (!m) return null; const p = pt.matrixTransform(m.inverse());
  const x = Math.round((p.x - g.ml) / g.cell) * g.xs + cfg.xmin, y = cfg.ymax - Math.round((p.y - g.mt) / g.cell) * g.ys;
  if (x < cfg.xmin || x > cfg.xmax || y < cfg.ymin || y > cfg.ymax) return null;
  return { x, y, sx: g.px(x), sy: g.py(y) };
}

function startStation(id) {
  const st = STATIONS.find(s => s.id === id);
  cur = { st, ex: st.gen(), i: 0, step: 0, placed: [], placedStep: 0, stepDone: false, connect: null, drawnLine: null, errStep: 0, t0: Date.now(), errors: 0 };
  stOf(id).att++; save();
  renderExercise();
}

function renderExercise() {

  } else if (step.type === "table") {

  }

  </div>
  <section class="card">

  app.querySelector("#sayq").onclick = () => say(stripHTML((e.ctx ? e.ctx + ". " : "") + step.q + (step.type === "place" ? ". Puntos: " + step.targets.map(t => co(t.x, t.y)).join(", ") : "")), true);
  app.querySelector("#bHelp").onclick = () => { app.querySelector("#help").classList.add("show"); say(step.help, true); };
  app.querySelector("#bSolve").onclick = () => {
    if (step.type === "place") { const t = step.targets[Math.min(cur.placedStep, step.targets.length - 1)]; openSolve(walkSolve(t.x, t.y), [t.x, t.y], e.plane, "Cómo se ubica " + co(t.x, t.y)); }
    else openSolve(step.solve || [step.help], step.walk || null, step.walk ? (e.plane || P5) : null, "Cómo se resuelve");

function stripHTML(h) { const d = document.createElement("div"); d.innerHTML = h; return d.textContent.replace(/−/g, "menos ").replace(/×/g, " por ").replace(/;/g, ","); }
function tableHTML(h, cols, edit) {
  const cell = (v, hide, k, which) => hide && edit ? `<td><input type="text" ${v >= 0 ? 'inputmode="numeric"' : ""} autocomplete="off" id="c${which}${k}" data-ans="${v}" aria-label="Valor que falta"></td>` : `<td>${hide ? "?" : fmt(v)}</td>`;
  return `<table class="vt"><tr><th>${h[0]}</th>${cols.map((c, k) => cell(c.x, c.hx, k, "x")).join("")}</tr><tr><th>${h[1]}</th>${cols.map((c, k) => cell(c.y, c.hy, k, "y")).join("")}</tr></table>`;
}
function feedback(kind, text) {
  const fb = app.querySelector("#fb"); fb.className = "fb show pop " + kind;
  fb.innerHTML = `<span class="face">${kind === "good" ? "😊" : kind === "bad" ? "🤔" : "💡"}</span><span>${text}</span>`;
}
function stepOK(msg) {
  cur.stepDone = true; cur.errStep = 0;
  const e = cur.ex[cur.i]; const last = cur.step === e.steps.length - 1;
  const p = pick(PRAISE);
  feedback("good", `<b>${p}</b>${msg ? " " + msg : ""}${last ? "" : " Ahora la parte siguiente."}`);
  beep("ok"); say(p.replace(/[^\p{L}\p{N}\s!¡.,]/gu, ""));
  const n = app.querySelector("#bNext"); n.hidden = false; n.focus();
}
function stepBad(msg, type) {
  cur.errors++; cur.errStep++; const t = stOf(cur.st.id); t.err++; if (type) t.errTypes[type] = (t.errTypes[type] || 0) + 1; save();
  feedback("bad", `${msg || pick(RETRY)}${cur.errStep >= 2 ? " <b>Mirá la ayuda de abajo.</b>" : ""}`);
  if (cur.errStep >= 2) app.querySelector("#help").classList.add("show");
  beep("bad"); say(stripHTML(msg || "Probá otra vez"));
}
function answerMC(btn, step) {
  if (cur.stepDone) return;
  const o = step.options[+btn.dataset.k];
  if (o.ok) { btn.classList.add("good"); app.querySelectorAll(".opt").forEach(b => b.disabled = true); stepOK(""); }
  else { btn.classList.add("bad", "shake"); btn.disabled = true; stepBad(pick(RETRY), "opción"); }
}
function checkTable(step) {
  if (cur.stepDone) return;
  const inps = [...app.querySelectorAll("table.vt input")]; let bad = 0, empty = 0;
  inps.forEach(inp => { const v = inp.value.replace(",", ".").replace(/[−–—]/g, "-").replace(/\s/g, "");
    if (v === "") { empty++; inp.classList.remove("good", "bad"); return; }
    if (Number(v) === Number(inp.dataset.ans)) { inp.classList.add("good"); inp.classList.remove("bad"); inp.readOnly = true; } else { inp.classList.add("bad"); inp.classList.remove("good"); bad++; } });
  if (empty && !bad) { feedback("info", `Te faltan completar ${empty} casillero${empty > 1 ? "s" : ""}.`); return; }
  if (bad || empty) { stepBad(`Hay ${bad} número${bad > 1 ? "s" : ""} para revisar (en color). Los verdes ya están bien.`, "tabla"); const f = app.querySelector("table.vt input.bad"); if (f) f.focus(); }
  else stepOK("La tabla está completa.");
}
function bindPlane(cfg, step) {
  const box = app.querySelector("#pbox"); const svg = box.querySelector("svg"); const ghost = svg.querySelector("#ghost");
  svg.addEventListener("pointermove", ev => { const p = svgPointToData(svg, cfg, ev); if (p) { ghost.setAttribute("cx", p.sx); ghost.setAttribute("cy", p.sy); } });
  svg.addEventListener("pointerleave", () => { ghost.setAttribute("cx", -50); });
  svg.addEventListener("click", ev => {
    const p = svgPointToData(svg, cfg, ev); if (!p) return;
    const t = step.targets[cur.placedStep];
    if (p.x === t.x && p.y === t.y) {
      cur.placed.push({ x: t.x, y: t.y, label: t.label || "" }); cur.placedStep++;
      if (step.connect) cur.connect = { on: true, closed: false };
      if (cur.placedStep >= step.targets.length) {
        if (step.connect && step.close) cur.connect.closed = true;
        if (step.drawLine) cur.drawnLine = step.drawLine;
        cur.stepDone = true; renderExercise();
        stepOK(step.drawLine ? "¡Mirá! Los puntos quedaron alineados y forman una recta." : step.connect ? "¡Se formó la figura!" : "");
      } else { beep("tick"); renderExercise(); feedback("good", `✔ ${t.label ? t.label + " " : ""}${co(t.x, t.y)} bien ubicado. Ahora el siguiente.`); }
    } else {
      let msg, type;
      if (p.x === t.y && p.y === t.x) { msg = `Marcaste ${co(p.x, p.y)}. ¡Ojo con el orden! Primero va el movimiento hacia los costados (→ ←) y después hacia arriba o abajo (↑ ↓).`; type = "orden"; }
      else if ((p.x === -t.x && t.x !== 0 && p.y === t.y) || (p.y === -t.y && t.y !== 0 && p.x === t.x) || (p.x === -t.x && p.y === -t.y)) { msg = `Marcaste ${co(p.x, p.y)}. Revisá el signo: el negativo te lleva hacia la izquierda o hacia abajo.`; type = "signo"; }
      else if (p.x === t.x) { msg = `Marcaste ${co(p.x, p.y)}. El 1.º número está bien. Revisá cuánto vas hacia arriba o hacia abajo.`; type = "conteo"; }
      else if (p.y === t.y) { msg = `Marcaste ${co(p.x, p.y)}. El 2.º número está bien. Revisá cuánto vas hacia los costados.`; type = "conteo"; }
      else { msg = `Marcaste ${co(p.x, p.y)}. Buscamos ${co(t.x, t.y)}. Empezá desde el (0 ; 0).`; type = "conteo"; }
      stepBad(msg, type);
    }
  });
}
function nextStep() {
  if (!cur || !cur.stepDone) return; // no se puede avanzar sin resolver
  const e = cur.ex[cur.i];
  if (cur.step < e.steps.length - 1) { cur.step++; cur.stepDone = false; cur.placedStep = 0; if (e.steps[cur.step].type === "place" && !e.steps[cur.step].connect) { /* nuevo paso de marcar: conserva lo anterior */ } renderExercise(); return; }
  cur.i++; cur.step = 0; cur.stepDone = false; cur.placed = []; cur.placedStep = 0; cur.connect = null; cur.drawnLine = null; cur.errStep = 0;
  if (cur.i >= cur.ex.length) return finishStation();
  renderExercise();
}
function finishStation() {
  const t = stOf(cur.st.id); const first = !t.done; t.done = true; t.ms += Date.now() - cur.t0; t.lastErr = cur.errors; save();
  beep("win"); confetti(); say(`¡Estación ${cur.st.id} completa! ${allDone() ? "¡Completaste todo el viaje!" : ""}`);
  const miss = STATIONS.filter(s => !stOf(s.id).done).map(s => s.id);
  const nextId = miss.find(id => id > cur.st.id) || miss[0];
  app.innerHTML = `
  <section class="card" style="text-align:center">
    <div style="font-size:3.5rem" class="pop">🏅</div>
    <h2>¡Estación ${cur.st.id} completa!</h2>
    <p>${esc(S.name)}, terminaste <b>${cur.st.title}</b>${cur.errors === 0 ? " sin ningún error. ¡Impecable!" : "."}</p>
    <p><b>¿Cómo te fue en esta estación?</b></p>
    <div class="row" style="justify-content:center" id="feel">
      <button class="btn alt" data-f="🙂">🙂 Me salió bien</button><button class="btn alt" data-f="😐">😐 Más o menos</button><button class="btn alt" data-f="😕">😕 Me costó</button>
    </div>
    <div class="actions" style="justify-content:center">
      ${allDone() ? `<button class="btn ok" id="dip">🏅 Ver mi diploma</button>` : nextId ? `<button class="btn sig" id="nx">🚂 Seguir a la estación ${nextId}</button>` : ""}
      <button class="btn alt" id="again">🔄 Practicar más esta estación</button>
      <button class="btn alt" id="mp">🗺️ Ver el mapa</button>
    </div>
    ${!allDone() ? `<p class="small muted">Para el diploma te faltan: ${miss.join(", ")}.</p>` : ""}
  </section>`;
  app.querySelectorAll("#feel button").forEach(b => b.onclick = () => { t.feel = b.dataset.f; save(); app.querySelectorAll("#feel button").forEach(x => x.setAttribute("aria-pressed", x === b)); b.classList.remove("alt"); });
  const nx = app.querySelector("#nx"); if (nx) nx.onclick = () => startStation(nextId);
  const dp = app.querySelector("#dip"); if (dp) dp.onclick = screenDiploma;
  app.querySelector("#again").onclick = () => startStation(cur.st.id);
  app.querySelector("#mp").onclick = screenMap;
}

/* ---------- Modal "Cómo se resuelve" con animación del camino ---------- */
let walkTimer = null;
function stopWalk() { if (walkTimer) clearInterval(walkTimer); walkTimer = null; }
function openSolve(lines, walk, plane, title) {
  const m = document.createElement("div"); m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
  let k = 0;
  const draw = () => {
    m.innerHTML = `<div class="card"><h2>🎬 ${title}</h2>
      ${walk && plane ? `<div class="planebox" style="margin-top:10px">${planeSVG(plane, { walk: [walk[0], walk[1], k + 1] })}</div>` : ""}
      <ol class="steps">${lines.map((l, i) => `<li class="${i === k ? "cur" : ""}" ${i > k ? 'style="opacity:.35"' : ""}>${l}</li>`).join("")}</ol>
      <div class="actions"><button class="btn" id="sNext" ${k >= lines.length - 1 ? "hidden" : ""}>▶️ Siguiente paso</button><button class="btn alt" id="sClose">✖️ Cerrar</button></div></div>`;
    m.querySelector("#sNext").onclick = () => { k++; draw(); say(stripHTML(lines[k])); };
    m.querySelector("#sClose").onclick = () => m.remove();
  };
  draw(); document.body.appendChild(m); say(stripHTML(lines[0]));
  m.addEventListener("click", ev => { if (ev.target === m) m.remove(); });
  const onEsc = ev => { if (ev.key === "Escape") { m.remove(); document.removeEventListener("keydown", onEsc); } };
  document.addEventListener("keydown", onEsc);
  setTimeout(() => { const b = m.querySelector("#sNext:not([hidden])") || m.querySelector("#sClose"); b && b.focus(); }, 50);
}

  app.innerHTML = `
  <section class="card noprint"><div class="row"><button class="btn alt" id="mp">🗺️ Volver al mapa</button>
    ${inIframe ? `<span class="small muted">Para imprimir, abrí el simulador desde su enlace publicado o hacé una captura de pantalla.</span>` : `<button class="btn" id="pr">🖨️ Imprimir diploma</button>`}</div></section>
  <section class="card"><div class="diploma pop">
    <img src="${LOGO_SRC}" alt="Escudo Escuela 718">
    <div style="font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase;font-size:.9rem">Escuela Provincial N.º 718 "Libertad" · Rada Tilly</div>
    <h2>Diploma de Explorador del Plano</h2>
    <p>Se otorga a</p>
    <div class="who">${esc(S.name)}</div>
    <p>por completar las <b>10 estaciones</b> del <b>Viaje por el Plano 2</b>: coordenadas con números negativos, figuras en los cuatro cuadrantes, tablas de proporcionalidad, fórmulas, lectura de gráficos y gráfico de rectas.</p>
    <div class="seal">🚂🏅🧭</div>

/* ---------- Actividades para la carpeta (con clave de corrección) ---------- */
const ACTS = [
  { t: "1. Leer coordenadas", items: ["Escribí las coordenadas de los puntos: A está 4 a la derecha y 0 hacia arriba; B está 0 a la derecha y 6 hacia arriba; C está 3 a la derecha y 5 hacia arriba."],
    key: "A (4 ; 0) · B (0 ; 6) · C (3 ; 5)" },
  { t: "2. ¿Hacia dónde vas?", items: [`Completá: para llegar a (${MINUS}4 ; 3) vas <span class="blank"></span> hacia la <span class="blank"></span> y <span class="blank"></span> hacia <span class="blank"></span>.`, `Completá: para llegar a (2 ; ${MINUS}5) vas <span class="blank"></span> hacia la <span class="blank"></span> y <span class="blank"></span> hacia <span class="blank"></span>.`],
    key: `(${MINUS}4 ; 3): vas 4 hacia la izquierda y 3 hacia arriba. · (2 ; ${MINUS}5): vas 2 hacia la derecha y 5 hacia abajo.` },
  { t: "3. ¿En qué cuadrante está?", items: [`(${MINUS}2 ; ${MINUS}3) · (5 ; ${MINUS}1) · (${MINUS}4 ; 2) · (3 ; 3)`],
    key: `(${MINUS}2 ; ${MINUS}3): 3.º cuadrante · (5 ; ${MINUS}1): 4.º cuadrante · (${MINUS}4 ; 2): 2.º cuadrante · (3 ; 3): 1.º cuadrante` },
  { t: "4. Formar una figura", items: [`En tu carpeta, dibujá un plano del ${MINUS}5 al 5 y uní en orden: A (${MINUS}3 ; ${MINUS}2), B (3 ; ${MINUS}2), C (3 ; 2), D (${MINUS}3 ; 2). ¿Qué figura se forma? ¿Cuántos cuadraditos mide el lado AB?`],
    key: "Se forma un rectángulo. El lado AB mide 6 cuadraditos (3 desde −3 hasta 0, y 3 desde 0 hasta 3)." },
  { t: "5. Proporcionalidad directa", items: ["Cada caja trae 6 alfajores. Completá: 1 caja → 6 · 3 cajas → ___ · 5 cajas → ___ · ___ cajas → 48 · 10 cajas → ___"],
    key: "18 · 30 · 8 cajas (48 ÷ 6) · 60" },
  { t: "6. Tabla con fórmula", items: [`Una planta mide 4 cm y crece 3 cm por semana: altura = 4 + 3 ${mul} semanas. Completá: 0 semanas → ___ · 2 semanas → ___ · 5 semanas → ___ · ___ semanas → 22 cm`],
    key: "4 cm · 10 cm · 19 cm · 6 semanas (22 − 4 = 18; 18 ÷ 3 = 6)" },
  { t: "7. Descubrí la fórmula", items: ["x: 0, 1, 2, 3 — y: 5, 7, 9, 11. ¿Cuál es la fórmula?"],
    key: `y = 2 ${mul} x + 5 (empieza en 5 y aumenta 2 cada vez)` },
  { t: "8. ¿Es proporcionalidad directa?", items: ["Tabla A — x: 1, 2, 3 · y: 4, 8, 12. Tabla B — x: 1, 2, 3 · y: 5, 8, 11."],
    key: "Tabla A: SÍ (y ÷ x da siempre 4). Tabla B: NO (5 ÷ 1 = 5, pero 8 ÷ 2 = 4)." },
  { t: "9. Leer un gráfico", items: ["Una vela mide 12 cm y se achica 2 cm por hora. ¿Cuánto mide a las 3 horas? ¿A qué hora mide 4 cm? ¿Cuándo se termina?"],
    key: "A las 3 horas mide 6 cm. Mide 4 cm a las 4 horas. Se termina a las 6 horas (12 ÷ 2 = 6)." },
  { t: "10. Graficar una recta", items: [`Completá la tabla de y = 2 ${mul} x ${MINUS} 1 para x = ${MINUS}2, ${MINUS}1, 0, 1, 2 y marcá los puntos. ¿Dónde corta al eje vertical?`],
    key: `y: ${MINUS}5, ${MINUS}3, ${MINUS}1, 1, 3. Puntos: (${MINUS}2 ; ${MINUS}5), (${MINUS}1 ; ${MINUS}3), (0 ; ${MINUS}1), (1 ; 1), (2 ; 3). Corta al eje vertical en (0 ; ${MINUS}1).` }
];
function screenActs() {
  stopWalk();
  app.innerHTML = `
  <section class="card">
    <div class="row noprint" style="justify-content:space-between"><h2>📝 Actividades para la carpeta</h2>
      <div class="row"><button class="btn alt" id="allKey">👁️ Mostrar todas las respuestas</button>${inIframe ? "" : `<button class="btn alt" id="pr">🖨️ Imprimir</button>`}<button class="btn alt" id="mp">🗺️ Mapa</button></div></div>
    <p class="muted">Resolvé en tu carpeta. Después tocá <b>Ver respuesta</b> para corroborar. Si te equivocaste, buscá la estación del mismo número y practicá.</p>
    ${ACTS.map((a, k) => `<div class="act"><h3>${a.t}</h3><ol>${a.items.map(i => `<li>${i}</li>`).join("")}</ol>
      <button class="btn alt noprint" data-k="${k}" style="padding:6px 14px;font-size:.9rem">✅ Ver respuesta</button><div class="key" id="key${k}"><b>Respuesta:</b> ${a.key}</div></div>`).join("")}
  </section>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { const kk = app.querySelector("#key" + b.dataset.k); kk.classList.toggle("show"); b.textContent = kk.classList.contains("show") ? "🙈 Ocultar respuesta" : "✅ Ver respuesta"; });
  app.querySelector("#allKey").onclick = () => app.querySelectorAll(".key").forEach(k => k.classList.add("show"));
  app.querySelector("#mp").onclick = screenMap;
  const pr = app.querySelector("#pr"); if (pr) pr.onclick = () => window.print();
}

/* ---------- Panel docente (Ctrl + D) ---------- */
function openPanel() {
  const m = document.createElement("div"); m.className = "modal";
  const mmss = ms => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const rows = STATIONS.map(s => { const t = stOf(s.id); const et = t.errTypes || {};
    return `<tr><td style="text-align:left">${s.id}. ${s.title}</td><td>${t.done ? "✔" : t.att ? "…" : "—"}</td><td>${t.att}</td><td>${t.err}</td><td>${et.orden || 0}</td><td>${et.signo || 0}</td><td>${(et.conteo || 0)}</td><td>${(et.tabla || 0) + (et["opción"] || 0)}</td><td>${mmss(t.ms)}</td><td>${t.feel || "—"}</td></tr>`; }).join("");
  m.innerHTML = `<div class="card panel" style="max-width:900px"><h2>Registro de seguimiento · Viaje por el Plano 2</h2>
    <p class="small muted">Estudiante: <b>${esc(S.name || "—")}</b> · Estaciones completas: ${STATIONS.filter(s => stOf(s.id).done).length}/10 · Datos guardados solo en este dispositivo.</p>
    <div class="tblwrap"><table><tr><th>Estación</th><th>Estado</th><th>Ingresos</th><th>Errores</th><th>Orden (x;y) invertido</th><th>Signo</th><th>Conteo</th><th>Tabla / opción</th><th>Tiempo</th><th>Autoev.</th></tr>${rows}</table></div>
    <p class="small"><b>Lectura sugerida:</b> errores de <i>orden</i> indican que confunde abscisa y ordenada; de <i>signo</i>, dificultad con la ubicación de negativos; de <i>conteo</i>, errores de desplazamiento (revisar el paso por el 0).</p>
    <label for="obs"><b>Observaciones del docente:</b></label><textarea id="obs" rows="3" style="width:100%">${esc(S.obs || "")}</textarea>
    <div class="actions noprint">${inIframe ? "" : `<button class="btn" id="pPr">🖨️ Imprimir informe</button>`}<button class="btn alt" id="pDel">🗑️ Borrar progreso</button><button class="btn alt" id="pClose">↩️ Volver</button></div>
    <div id="delc" class="fb info noprint"><span>¿Seguro que querés borrar todo el progreso de este dispositivo?</span><button class="btn" id="pYes">Sí, borrar</button><button class="btn alt" id="pNo">No</button></div>
    <p class="small muted">🔒 Panel privado. Se abre con Ctrl + D (o Ctrl + Alt + D) desde cualquier pantalla.</p></div>`;
  document.body.appendChild(m);
  m.querySelector("#obs").oninput = ev => { S.obs = ev.target.value; save(); };
  m.querySelector("#pClose").onclick = () => m.remove();
  const pp = m.querySelector("#pPr"); if (pp) pp.onclick = () => window.print();
  m.querySelector("#pDel").onclick = () => m.querySelector("#delc").classList.add("show");
  m.querySelector("#pNo").onclick = () => m.querySelector("#delc").classList.remove("show");
  m.querySelector("#pYes").onclick = () => { S = { name: "", st: {}, obs: "", font: S.font, voice: S.voice, calm: S.calm }; save(); m.remove(); screenHome(); };
}

/* ---------- 5) SONIDO, VOZ Y MÚSICA ---------- */
let AC = null;
function ac() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} return AC; }
function tone(f, t0, d, type = "sine", vol = .12) { const c = ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, c.currentTime + t0); g.gain.linearRampToValueAtTime(vol, c.currentTime + t0 + .02); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + t0 + d); o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + d + .05); }
function beep(k) {
  if (!S.voice) return;
  if (k === "ok") { tone(660, 0, .15); tone(880, .12, .25); }
  else if (k === "bad") { tone(300, 0, .2, "triangle", .08); }
  else if (k === "tick") { tone(740, 0, .1, "sine", .08); }
  else if (k === "start") { tone(523, 0, .15); tone(659, .14, .15); tone(784, .28, .3); }
  else if (k === "win") { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .14, .35, "triangle", .1)); }
}
let VOICE = null;
function pickVoice() { try { const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => /es[-_]AR/i.test(v.lang)) || vs.find(v => /es[-_](419|MX|US)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; } catch (e) {} }
function say(text, force) {
  if (!S.voice || !text) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/−/g, "menos ").replace(/×/g, " por ")); u.lang = VOICE ? VOICE.lang : "es-AR"; if (VOICE) u.voice = VOICE; u.rate = .95; speechSynthesis.speak(u); } catch (e) {}
}
let music = null;
function startMusic() { // música suave y alegre generada en el momento (sin archivos externos)
  const c = ac(); if (!c) return;
  const notes = [392, 494, 587, 494, 440, 523, 659, 523, 392, 494, 587, 784, 659, 587, 523, 494];
  const bass = [196, 196, 220, 220, 196, 196, 165, 175];
  let i = 0;
  music = setInterval(() => { tone(notes[i % notes.length], 0, .28, "triangle", .035); if (i % 2 === 0) tone(bass[(i / 2) % bass.length], 0, .5, "sine", .04); i++; }, 300);
}
function stopMusic() { if (music) clearInterval(music); music = null; }

function confetti() {
  if (S.calm || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas"); cv.className = "confetti"; cv.width = innerWidth; cv.height = innerHeight; document.body.appendChild(cv);
  const cx = cv.getContext("2d"); const cols = ["#1f3f9e", "#f2b632", "#1e8a52", "#c4533a", "#8fa9f5"];
  const P = Array.from({ length: 120 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, r: 4 + Math.random() * 5, c: pick(cols), a: Math.random() * 6 }));
  let f = 0; (function loop() { cx.clearRect(0, 0, cv.width, cv.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .1; cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); cx.restore(); }); if (++f < 140) requestAnimationFrame(loop); else cv.remove(); })();
}

/* ---------- 6) INICIO ---------- */
function applyPrefs() {
  document.documentElement.style.setProperty("--base", S.font + "px");
  document.getElementById("tVoice").setAttribute("aria-pressed", S.voice);
  document.getElementById("tCalm").setAttribute("aria-pressed", S.calm);
  document.body.classList.toggle("calm", S.calm);
}
function init() {
  document.querySelectorAll("img.logo718").forEach(i => i.src = LOGO_SRC);
  load(); applyPrefs();
  try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
  document.getElementById("fMinus").onclick = () => { S.font = Math.max(15, S.font - 1); applyPrefs(); save(); };
  document.getElementById("fPlus").onclick = () => { S.font = Math.min(24, S.font + 1); applyPrefs(); save(); };
  document.getElementById("tVoice").onclick = () => { S.voice = !S.voice; applyPrefs(); save(); if (S.voice) say("Voz activada"); else try { speechSynthesis.cancel(); } catch (e) {} };
  document.getElementById("tCalm").onclick = () => { S.calm = !S.calm; if (S.calm) { stopMusic(); document.getElementById("tMusic").setAttribute("aria-pressed", false); } applyPrefs(); save(); };
  document.getElementById("tMusic").onclick = ev => { const on = !music; if (on) startMusic(); else stopMusic(); ev.currentTarget.setAttribute("aria-pressed", on); };
  document.getElementById("goMap").onclick = () => { if (!S.name) return screenHome(); screenMap(); };
  document.getElementById("goAct").onclick = screenActs;
  document.addEventListener("keydown", ev => { if (ev.ctrlKey && (ev.key === "d" || ev.key === "D")) { ev.preventDefault(); openPanel(); } });
  screenHome();
}
if (typeof window !== "undefined" && typeof document !== "undefined" && document.getElementById) init();
</script>
